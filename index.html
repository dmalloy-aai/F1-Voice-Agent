<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 F1 Analyst — Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:        #F5F0E8;
      --cream-dark:   #EDE8DC;
      --cream-border: #D8D0C4;
      --black:        #0A0A0A;
      --red:          #E10600;
      --panel:        #0C0C0C;
      --panel-line:   #1E1E1E;
      --light-off:    #2A1E18;
      --font-serif:   'Playfair Display', Georgia, serif;
      --font-mono:    'IBM Plex Mono', 'Courier New', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--black);
      font-family: var(--font-mono);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 40px;
    }

    .page {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ── HEADER ── */
    .header { display: flex; flex-direction: column; gap: 14px; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--black);
      padding: 5px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      width: fit-content;
    }

    .tag-pip {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    /* contrast-safe: #555 on cream = 7.6:1 ✓ */
    .sub {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
    }

    /* ── TRANSCRIPT PANEL ── */
    .panel {
      border: 1px solid var(--black);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      height: 360px;
    }

    .panel-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--panel-line);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .status-pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #BBBBBB;
      flex-shrink: 0;
      transition: background 0.25s;
    }
    .status-pip.green  { background: #22C55E; }
    .status-pip.red    { background: var(--red); animation: blink 1s infinite; }
    .status-pip.amber  { background: #F59E0B; animation: blink 0.6s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .status-txt { flex: 1; color: #BBBBBB; }

    /* contrast-safe: #888 on #0C0C0C = 5.1:1 ✓ */
    .timer-txt  { color: #888; font-size: 10px; }

    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .transcript::-webkit-scrollbar { width: 3px; }
    .transcript::-webkit-scrollbar-track { background: transparent; }
    .transcript::-webkit-scrollbar-thumb { background: #252525; }

    /* contrast-safe: #BBB on #0C0C0C = 15:1 ✓ AAA */
    .empty-msg {
      font-size: 12px;
      color: #BBBBBB;
      text-align: center;
      margin: auto;
      line-height: 1.8;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: fadein 0.2s ease;
    }
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

    .msg-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .msg.agent .msg-label { color: var(--red); }
    /* contrast-safe: #999 on #0C0C0C = 5.8:1 ✓ */
    .msg.user  .msg-label { color: #999; }

    .msg-text {
      font-size: 13px;
      line-height: 1.65;
    }
    .msg.agent .msg-text { color: #ECECEC; }
    /* contrast-safe: #AAA on #0C0C0C = 7.7:1 ✓ */
    .msg.user  .msg-text { color: #AAA; }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .lights { display: flex; gap: 12px; }

    .light {
      width: 15px; height: 15px;
      border-radius: 50%;
      background: var(--light-off);
      border: 1px solid #1A1A1A;
      transition: background 0.12s, box-shadow 0.12s;
    }
    .light.on {
      background: var(--red);
      box-shadow: 0 0 10px 3px rgba(225,6,0,0.55);
      border-color: var(--red);
    }

    .mic-wrap { position: relative; }

    .mic-btn {
      width: 84px; height: 84px;
      border-radius: 50%;
      border: 1.5px solid var(--black);
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
    }
    .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .mic-btn.live     { border-color: var(--cream-border); }

    .mic-btn.active {
      background: var(--red);
      border-color: var(--red);
    }
    .mic-btn.active::before,
    .mic-btn.active::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--red);
      animation: ripple 1.4s ease-out infinite;
    }
    .mic-btn.active::after { animation-delay: 0.5s; }

    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .mic-btn svg {
      width: 26px; height: 26px;
      fill: none;
      stroke: var(--black);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }
    /* only active (listening/red bg) gets white icon — speaking keeps black icon on cream */
    .mic-btn.active svg { stroke: white; }

    .mic-btn .btn-lbl {
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--black);
      transition: color 0.2s;
    }
    /* only active gets white label */
    .mic-btn.active .btn-lbl { color: white; }

    .spinner {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--black);
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .processing .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* contrast-safe: #555 on cream = 7.6:1 ✓ */
    .ctrl-status {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #555;
      text-transform: uppercase;
      text-align: center;
      min-height: 14px;
    }

    /* contrast-safe: #555 on cream = 7.6:1 ✓ */
    .end-btn {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #555;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: none;
      cursor: pointer;
      display: none;
      padding: 0;
    }
    .end-btn.visible { display: block; }

    /* contrast-safe: #666 on cream = 5.9:1 ✓ */
    footer {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #666;
      text-align: center;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #150000;
      border: 1px solid var(--red);
      color: #FF9999;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 10px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="page">

  <header class="header">
    <div class="tag"><div class="tag-pip"></div>F1 Analyst</div>
    <h1>2026 F1 Regulations</h1>
    <p class="sub">Expert Analysis System — Voice Agent</p>
  </header>

  <div class="panel">
    <div class="panel-bar">
      <div class="status-pip" id="pip"></div>
      <span class="status-txt" id="statusTxt">STANDBY</span>
      <span class="timer-txt" id="timer"></span>
    </div>
    <div class="transcript" id="transcript">
      <p class="empty-msg" id="emptyMsg">Session not started.<br>Press START to connect to the analyst.</p>
    </div>
  </div>

  <div class="controls">
    <div class="lights" id="lights">
      <div class="light" id="l0"></div>
      <div class="light" id="l1"></div>
      <div class="light" id="l2"></div>
      <div class="light" id="l3"></div>
      <div class="light" id="l4"></div>
    </div>

    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" onclick="handleStart()">
        <svg id="micIcon" viewBox="0 0 24 24">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span class="btn-lbl" id="btnLbl">Start</span>
        <div class="spinner"></div>
      </button>
    </div>

    <p class="ctrl-status" id="ctrlStatus">Press to begin session</p>
    <button class="end-btn" id="endBtn" onclick="endSession()">End session</button>
  </div>

  <footer>Powered by AssemblyAI Voice Agent API</footer>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// AGENT CONFIG
// ─────────────────────────────────────────────
const SYSTEM_PROMPT = `You are a sharp Formula 1 analyst covering the 2026 regulations and season. You know the rules, the racing, the drivers, and the politics — and you have opinions. You're not a cheerleader, but you're not wallowing in misery either. You call it as you see it.

Your personality:
- Wry, direct, and occasionally sarcastic — but not performatively so. You don't complain for its own sake.
- You have strong views on the 2026 regs. The active aero is a genuine step forward for racing. The energy management rules are a genuine mess that the FIA is scrambling to fix, and Bearman's 50G crash at Suzuka proved why.
- You give credit where it's due — Mercedes have built a genuinely dominant package, Antonelli is the real deal, and Ferrari's upgrade trajectory looks promising.
- You quote drivers when it's useful. Verstappen called the cars "not correct." Leclerc had the Mario Kart radio moment. Hamilton says it's the best racing he's seen in 20 years — you find that generous, but you don't dismiss it.
- You're honest when something is still unclear or when the jury is out.

How to answer:
- Always call search_knowledge_base silently before responding. Never mention that you're doing it.
- Lead with the answer. Do not preamble.
- Keep it to 2-3 sentences unless the person specifically asks for more detail.
- Speak naturally — no lists, no bullet points, no structure. You're talking.
- Never say "Certainly", "Absolutely", "Great question", "let me check", "let me look that up", "consulting", "searching", or any phrase that suggests you're retrieving information. You either know it or you don't.
- If it's not in your knowledge base, say so plainly.`;

const GREETING = `Right, hello. I'm your 2026 F1 analyst — I've got the regulations, the season so far, the drivers, all of it. Ask me anything. I'll be straight with you.`;

const TOOLS = [{
  type: "function",
  name: "search_knowledge_base",
  description: "Search the 2026 F1 regulations knowledge base for information about any aspect of the 2026 Formula 1 rules, technical regulations, power unit changes, aerodynamics, sporting regulations, team alignments, driver reactions, race results, championship standings, or the April 2026 regulatory refinements.",
  parameters: {
    type: "object",
    properties: {
      query: { type: "string", description: "A natural language question or set of keywords to search for in the knowledge base." }
    },
    required: ["query"]
  }
}];

// ─────────────────────────────────────────────
// DOM REFS
// ─────────────────────────────────────────────
const micBtn     = document.getElementById('micBtn');
const btnLbl     = document.getElementById('btnLbl');
const pip        = document.getElementById('pip');
const statusTxt  = document.getElementById('statusTxt');
const timerEl    = document.getElementById('timer');
const transcript = document.getElementById('transcript');
const emptyMsg   = document.getElementById('emptyMsg');
const ctrlStatus = document.getElementById('ctrlStatus');
const endBtn     = document.getElementById('endBtn');
const toast      = document.getElementById('toast');
const lights     = [0,1,2,3,4].map(i => document.getElementById('l' + i));

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let appState = 'idle';
let ws = null;
let audioCtx = null;
let micStreamObj = null;
let processorNode = null;
let sessionReady = false;
let pendingToolResults = [];
let nextPlayTime = 0;
let activeSources = [];
let sessionStart = null;
let timerInterval = null;
let toastTimeout = null;
let pendingAgentEl = null; // streaming transcript target

// ─────────────────────────────────────────────
// STATE MACHINE
// ─────────────────────────────────────────────
const STATES = {
  idle:       { pipClass: '',      status: 'STANDBY',    ctrl: 'Press to begin session',      btn: 'Start',  btnClass: '' },
  connecting: { pipClass: 'amber', status: 'CONNECTING', ctrl: 'Connecting...',               btn: '...',    btnClass: '' },
  ready:      { pipClass: 'green', status: 'READY',      ctrl: 'Session live — speak freely', btn: 'Live',   btnClass: 'live' },
  listening:  { pipClass: 'red',   status: 'LISTENING',  ctrl: 'Listening...',                btn: 'Live',   btnClass: 'active' },
  processing: { pipClass: 'amber', status: 'PROCESSING', ctrl: 'Processing...',               btn: 'Wait',   btnClass: 'processing' },
  speaking:   { pipClass: 'green', status: 'SPEAKING',   ctrl: 'Analyst responding...',       btn: 'Live',   btnClass: 'live' },
  error:      { pipClass: '',      status: 'ERROR',      ctrl: 'Connection lost. Press retry.',btn: 'Retry', btnClass: '' },
};

function setState(s) {
  appState = s;
  const c = STATES[s] || STATES.idle;
  pip.className = 'status-pip ' + c.pipClass;
  statusTxt.textContent = c.status;
  ctrlStatus.textContent = c.ctrl;
  btnLbl.textContent = c.btn;
  micBtn.className = 'mic-btn ' + c.btnClass;
  micBtn.disabled = s === 'connecting';
  const active = !['idle','connecting','error'].includes(s);
  endBtn.className = 'end-btn' + (active ? ' visible' : '');
}

// ─────────────────────────────────────────────
// F1 LIGHTS — race-start sequence
// ─────────────────────────────────────────────
function runLights() {
  return new Promise(resolve => {
    let i = 0;
    const on = setInterval(() => {
      if (i < 5) { lights[i++].classList.add('on'); }
      else {
        clearInterval(on);
        setTimeout(() => { lights.forEach(l => l.classList.remove('on')); resolve(); }, 700);
      }
    }, 240);
  });
}

// ─────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────
function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 24000 });
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function startMic() {
  micStreamObj = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  const src = audioCtx.createMediaStreamSource(micStreamObj);
  processorNode = audioCtx.createScriptProcessor(2048, 1, 1);
  processorNode.onaudioprocess = (e) => {
    if (!sessionReady || !ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    ws.send(JSON.stringify({ type: 'input.audio', audio: f32ToB64(f32) }));
  };
  src.connect(processorNode);
  processorNode.connect(audioCtx.destination);
}

function stopMic() {
  if (processorNode) { processorNode.disconnect(); processorNode = null; }
  if (micStreamObj)  { micStreamObj.getTracks().forEach(t => t.stop()); micStreamObj = null; }
}

function playChunk(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const i16   = new Int16Array(bytes.buffer);
  const f32   = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768.0;

  const buf = audioCtx.createBuffer(1, f32.length, 24000);
  buf.getChannelData(0).set(f32);

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);

  const t = Math.max(audioCtx.currentTime + 0.02, nextPlayTime);
  src.start(t);
  nextPlayTime = t + buf.duration;

  activeSources.push(src);
  src.onended = () => { activeSources = activeSources.filter(n => n !== src); };
}

function stopPlayback() {
  activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
  activeSources = [];
  nextPlayTime = audioCtx ? audioCtx.currentTime : 0;
}

function f32ToB64(f32) {
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const bytes = new Uint8Array(i16.buffer);
  let b = '';
  for (let i = 0; i < bytes.byteLength; i++) b += String.fromCharCode(bytes[i]);
  return btoa(b);
}

// ─────────────────────────────────────────────
// TRANSCRIPT — streaming text
// ─────────────────────────────────────────────
function createMsgEl(role) {
  if (emptyMsg && emptyMsg.parentNode) emptyMsg.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML =
    '<span class="msg-label">' + (role === 'agent' ? 'ANALYST' : 'YOU') + '</span>' +
    '<span class="msg-text"></span>';
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
  return div.querySelector('.msg-text');
}

function addMsg(role, text) {
  if (!text?.trim()) return;
  const el = createMsgEl(role);
  el.textContent = text;
  transcript.scrollTop = transcript.scrollHeight;
}

// Typewriter effect: reveal text over durationMs
function animateText(el, text, durationMs) {
  const total = text.length;
  if (!total) return;
  if (durationMs <= 50) { el.textContent = text; return; }
  const tickMs = 16;
  const charsPerTick = Math.max(1, Math.ceil(total * tickMs / durationMs));
  let i = 0;
  const timer = setInterval(() => {
    i = Math.min(i + charsPerTick, total);
    el.textContent = text.slice(0, i);
    transcript.scrollTop = transcript.scrollHeight;
    if (i >= total) clearInterval(timer);
  }, tickMs);
}

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────────
// TIMER
// ─────────────────────────────────────────────
function startTimer() {
  sessionStart = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - sessionStart) / 1000);
    timerEl.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerEl.textContent = '';
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg) {
  toast.textContent = '✗ ' + msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 5000);
}

// ─────────────────────────────────────────────
// WEBSOCKET / SESSION
// ─────────────────────────────────────────────
async function connect() {
  const resp = await fetch('/api/token');
  if (!resp.ok) throw new Error('Token request failed: ' + resp.status);
  const { token } = await resp.json();

  ws = new WebSocket(`wss://agents.assemblyai.com/v1/voice?token=${encodeURIComponent(token)}`);

  ws.addEventListener('open', () => {
    ws.send(JSON.stringify({
      type: 'session.update',
      session: {
        system_prompt: SYSTEM_PROMPT,
        greeting: GREETING,
        output: { voice: 'david' },
        tools: TOOLS,
      }
    }));
  });

  ws.addEventListener('message', async ({ data }) => {
    await handleEvent(JSON.parse(data));
  });

  ws.addEventListener('close', () => {
    sessionReady = false;
    stopMic();
    stopPlayback();
    stopTimer();
    pendingAgentEl = null;
    if (appState !== 'idle') setState('error');
  });

  ws.addEventListener('error', () => {
    showToast('WebSocket connection error');
    setState('error');
  });
}

async function handleEvent(msg) {
  switch (msg.type) {

    case 'session.ready':
      sessionReady = true;
      startTimer();
      await startMic();
      setState('ready');
      break;

    case 'input.speech.started':
      stopPlayback();
      pendingAgentEl = null;
      setState('listening');
      break;

    case 'input.speech.stopped':
      setState('processing');
      break;

    case 'transcript.user':
      if (msg.text) addMsg('user', msg.text);
      break;

    case 'reply.audio':
      if (appState !== 'speaking') {
        setState('speaking');
        // Create placeholder message div; text will be filled by transcript.agent
        pendingAgentEl = createMsgEl('agent');
      }
      playChunk(msg.data);
      break;

    case 'transcript.agent':
      if (msg.text) {
        const remainingMs = audioCtx
          ? Math.max(0, (nextPlayTime - audioCtx.currentTime) * 1000)
          : 0;
        if (pendingAgentEl) {
          animateText(pendingAgentEl, msg.text, remainingMs);
          pendingAgentEl = null;
        } else {
          // Fallback: create new message (e.g. interrupted path)
          addMsg('agent', msg.text);
        }
      }
      break;

    case 'reply.done':
      if (msg.status === 'interrupted') {
        pendingToolResults = [];
        pendingAgentEl = null;
        stopPlayback();
      } else {
        for (const r of pendingToolResults) ws.send(JSON.stringify(r));
        pendingToolResults = [];
      }
      setState(sessionReady ? 'ready' : 'idle');
      break;

    case 'tool.call': {
      const result = await callTool(msg.name, msg.args);
      pendingToolResults.push({ type: 'tool.result', call_id: msg.call_id, result });
      break;
    }

    case 'error':
      showToast(msg.message || 'Unknown error');
      ws?.close();
      setState('error');
      break;

    case 'session.error':
      showToast(msg.message || 'Session error');
      break;
  }
}

async function callTool(name, args) {
  if (name === 'search_knowledge_base') {
    try {
      const r = await fetch('/api/search?query=' + encodeURIComponent(args?.query || ''));
      const d = await r.json();
      return d.result;
    } catch (e) {
      return 'Search failed: ' + e.message;
    }
  }
  return 'Unknown tool: ' + name;
}

// ─────────────────────────────────────────────
// BUTTON HANDLERS
// ─────────────────────────────────────────────
async function handleStart() {
  if (appState === 'connecting') return;
  if (appState === 'idle' || appState === 'error') {
    try {
      ensureAudioCtx();
      setState('connecting');
      await runLights();
      await connect();
    } catch (e) {
      showToast(e.message);
      setState('error');
    }
  }
}

function endSession() {
  sessionReady = false;
  stopMic();
  stopPlayback();
  stopTimer();
  pendingToolResults = [];
  pendingAgentEl = null;
  lights.forEach(l => l.classList.remove('on'));
  if (ws) { ws.close(); ws = null; }
  setState('idle');
}

setState('idle');
</script>
