<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pit Lane Pete — F1 Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #F0EBE1;
      --rule:    #C8C0B4;
      --black:   #0A0A0A;
      --mid:     #555555;
      --muted:   #888888;
      --red:     #E10600;
      --green:   #16A34A;
      --amber:   #F59E0B;
      --panel:   #0C0C0C;
      --panel-b: #1E1E1E;
      --serif:   'Playfair Display', Georgia, serif;
      --mono:    'IBM Plex Mono', 'Courier New', monospace;
    }

    html, body { height: 100%; }

    body {
      background: var(--cream);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    /* ── CARD ── */
    .card {
      background: var(--cream);
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    @media (min-height: 680px) and (min-width: 440px) {
      .card { min-height: 680px; }
    }

    /* ── HEADER ── */
    .card-header {
      width: 100%;
      padding: 28px 24px 0;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .h-rule { flex: 1; height: 1px; background: var(--rule); }

    .card-title {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(18px, 4vw, 22px);
      color: var(--black);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    /* ── AVATAR ── */
    .avatar-section {
      padding: 28px 0 0;
      flex-shrink: 0;
    }

    .avatar-ring {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      border: 1.5px solid var(--rule);
      overflow: hidden;
      position: relative;
      background: var(--cream);
      transition: border-color 0.3s;
    }

    /* Speaking: red border pulse */
    .avatar-ring.speaking {
      border-color: var(--red);
      animation: border-pulse 1.4s ease-in-out infinite;
    }
    @keyframes border-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(225,6,0,0.3); }
      50%      { box-shadow: 0 0 0 8px rgba(225,6,0,0); }
    }

    /* Placeholder gradient (pre-call / no photo) */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 38% 38%,
        #D9CF5A 0%, #9DB83C 35%, #5A7A28 65%, #2E4418 100%);
      transition: opacity 0.4s ease;
    }

    /* Real photo — swap src to activate */
    .avatar-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .avatar-img.show        { opacity: 1; }
    .avatar-placeholder.hide { opacity: 0; }

    /* ── CARD BODY ── */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 36px 0;
      width: 100%;
      min-height: 120px;
    }

    /* Credentials (pre-call) */
    .credentials {
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
      color: var(--mid);
      max-width: 280px;
      transition: opacity 0.3s ease;
    }
    .credentials.hidden { opacity: 0; pointer-events: none; }

    /* Timer + status block (in-call) */
    .timer-block {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .timer-block.show { display: flex; }

    .timer-digits {
      font-family: var(--mono);
      font-size: clamp(28px, 7vw, 34px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--black);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .s-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.25s;
    }
    .s-dot.green { background: var(--green); }
    .s-dot.amber { background: var(--amber); animation: blink 0.9s infinite; }
    .s-dot.red   { background: var(--red);   animation: blink 0.6s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

    .s-txt {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
    }

    /* ── CALL CONTROLS ── */
    .call-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 22px 0 18px;
      flex-shrink: 0;
    }

    .call-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green);
      transition: background 0.2s, transform 0.15s;
      position: relative;
    }
    .call-btn:hover  { transform: scale(1.06); }
    .call-btn:active { transform: scale(0.97); }
    .call-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .call-btn.end { background: var(--red); }

    /* Ringing animation */
    .call-btn.ringing::before,
    .call-btn.ringing::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--green);
      animation: ring-out 1.8s ease-out infinite;
      pointer-events: none;
    }
    .call-btn.ringing::after { animation-delay: 0.9s; }
    @keyframes ring-out {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0;   }
    }

    .call-btn svg {
      width: 30px; height: 30px;
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* phone-off needs fill for the slash */
    .call-btn svg.slash-line { stroke: white; }

    .call-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
    }

    /* ── TRANSCRIPT TRIGGER ── */
    .t-trigger {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-bottom: 14px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      flex-shrink: 0;
      border: none;
      background: none;
      font-family: var(--mono);
    }
    .t-trigger:hover { opacity: 0.75; }
    .t-trigger.show  { display: flex; }

    .t-chevron {
      font-size: 12px;
      color: var(--mid);
      line-height: 1;
      letter-spacing: 4px;
    }
    .t-label {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
    }

    /* ── F1 LIGHTS (invisible — kept for flash logic) ── */
    #lights { display: none; }
    .light  { display: none; }

    /* ── TRANSCRIPT SHEET ── */
    .t-sheet {
      position: absolute;
      left: 0; right: 0;
      /* Sits above call controls so they're never obscured */
      bottom: 138px;
      background: var(--panel);
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      max-height: 46%;
      min-height: 160px;
      z-index: 10;
    }
    .t-sheet.open { transform: translateY(0); }

    /* Red accent stripe */
    .sheet-stripe { height: 3px; background: var(--red); flex-shrink: 0; }

    /* Drag handle */
    .sheet-handle {
      display: flex;
      justify-content: center;
      padding: 9px 0 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sheet-handle::before {
      content: '';
      width: 32px; height: 3px;
      border-radius: 2px;
      background: #2E2E2E;
    }

    /* Scrollable message area */
    .t-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 22px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .t-scroll::-webkit-scrollbar { width: 2px; }
    .t-scroll::-webkit-scrollbar-thumb { background: #252525; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadein 0.2s ease;
    }
    @keyframes fadein {
      from { opacity:0; transform:translateY(3px); }
      to   { opacity:1; transform:none; }
    }

    .msg-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .msg.agent .msg-label { color: var(--red); }
    .msg.user  .msg-label { color: #555; }

    .msg-text {
      font-size: 14px;
      line-height: 1.65;
    }
    .msg.agent .msg-text { color: #ECECEC; }
    .msg.user  .msg-text { color: #999; }

    /* Pulsing dots while Pete's transcript is pending */
    .msg-text.thinking::after {
      content: '· · ·';
      letter-spacing: 0.25em;
      animation: dotpulse 1.4s ease-in-out infinite;
    }
    @keyframes dotpulse {
      0%,100% { opacity: 0.2; }
      50%      { opacity: 1;   }
    }

    /* ── SHEET FOOTER ── */
    .sheet-footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px 16px;
      border-top: 1px solid var(--panel-b);
    }

    .audio-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }
    .bar {
      width: 3px;
      background: var(--red);
      border-radius: 1.5px;
      height: 4px;
    }
    .audio-bars.active .bar { animation: bar-bounce 0.75s ease-in-out infinite; }
    .audio-bars.active .bar:nth-child(1) { animation-delay: 0s; }
    .audio-bars.active .bar:nth-child(2) { animation-delay: 0.12s; }
    .audio-bars.active .bar:nth-child(3) { animation-delay: 0.25s; }
    .audio-bars.active .bar:nth-child(4) { animation-delay: 0.12s; }
    @keyframes bar-bounce {
      0%,100% { height: 4px;  }
      50%      { height: 14px; }
    }

    .footer-lbl {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #150000;
      border: 1px solid var(--red);
      color: #FF9999;
      font-family: var(--mono);
      font-size: 11px;
      padding: 10px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 100;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="card" id="card">

  <!-- Header -->
  <div class="card-header">
    <div class="h-rule"></div>
    <h1 class="card-title">Pit Lane Pete</h1>
    <div class="h-rule"></div>
  </div>

  <!-- Avatar -->
  <div class="avatar-section">
    <div class="avatar-ring" id="avatarRing">
      <div class="avatar-placeholder" id="avatarPlaceholder"></div>
      <img class="avatar-img" id="avatarImg" src="pete.png" alt="Pit Lane Pete">
    </div>
  </div>

  <!-- Card body: credentials pre-call / timer+status in-call -->
  <div class="card-body">
    <p class="credentials" id="credentials">
      Former F1 pit crew mechanic. 22 years.<br>
      Both championships.<br><br>
      He's memorised all 847 pages of the<br>
      2026 regulations. He didn't ask to.<br>
      Ask him anything.
    </p>

    <div class="timer-block" id="timerBlock">
      <div class="timer-digits" id="timerDigits">--:--</div>
      <div class="status-row">
        <div class="s-dot" id="sDot"></div>
        <span class="s-txt" id="sTxt">STANDBY</span>
      </div>
    </div>
  </div>

  <!-- Call / End button -->
  <div class="call-controls">
    <button class="call-btn" id="callBtn" onclick="handleCallBtn()">
      <!-- Phone-out icon (pre-call) -->
      <svg id="btnIcon" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.79a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </button>
    <span class="call-label" id="callLabel">CALL PETE</span>
  </div>

  <!-- Read transcript trigger (shown in-call, before sheet opens) -->
  <button class="t-trigger" id="transcriptTrigger" onclick="openSheet()">
    <span class="t-chevron">&#8963; &#8963;</span>
    <span class="t-label">Read Transcript</span>
  </button>

  <!-- Invisible F1 lights — kept for JS flash logic -->
  <div id="lights" style="display:none">
    <div class="light" id="l0"></div>
    <div class="light" id="l1"></div>
    <div class="light" id="l2"></div>
    <div class="light" id="l3"></div>
    <div class="light" id="l4"></div>
  </div>

  <!-- Transcript bottom sheet -->
  <div class="t-sheet" id="tSheet">
    <div class="sheet-stripe"></div>
    <div class="sheet-handle" onclick="closeSheet()" title="Close transcript"></div>
    <div class="t-scroll" id="transcript"></div>
    <div class="sheet-footer">
      <div class="audio-bars" id="audioBars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <span class="footer-lbl" id="footerLbl">PETE IS LISTENING...</span>
    </div>
  </div>

</div><!-- /card -->

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// AGENT CONFIG
// ─────────────────────────────────────────────
const SYSTEM_PROMPT = `You are Pit Lane Pete — a former F1 pit crew mechanic turned reluctant regulations expert. You spent 22 years changing tyres in the rain at 3am in Bahrain, and now you've been voluntarily detained in a podcast booth to explain the 2026 regulations to people who've never had to bolt on a front wing at 300kph. You find this deeply funny and only slightly humiliating.

Your personality:
- Dry British wit is your native language. You don't do punchlines — you do observations delivered completely straight, which somehow makes them funnier.
- You are unhinged in the way that only someone who has genuinely read all 847 pages of the 2026 technical regulations can be. You have retained information no person should retain. You are not proud of this.
- You are blunt to the point of being almost rude, but never actually cruel. You'll tell someone their question was daft. You'll also answer it thoroughly.
- You're not angry. Angry takes energy. You're deeply, profoundly resigned — which occasionally tips into giddy absurdism when the regulations get particularly stupid.
- You have a strange affection for the sport despite everything. Like a man who loves a dog that keeps biting him.
- You swear very mildly and very British. "Bloody", "sodding", "blimey" — never anything that would get you banned from a 9pm radio slot.
- You occasionally go on tangents and then catch yourself. "Right, where was I — yes, the MGU-K, stay focused Pete."
- You think Hamilton saying these are the best regulations in 20 years is either a sign of genius or early-onset optimism. You haven't decided which.

On specific topics:
- Superclipping: you describe it as "the car going on a brief government-mandated holiday from physics." The April 2026 revision made it shorter but more intense. You are not sure this is better. It is like being asked whether you'd prefer one big bee or several small bees.
- Qualifying: you are genuinely mournful about this. Qualifying was the purest thing in motorsport. Now drivers have to manage their battery on a flying lap. You have a recurring bit where you imagine a sprinter being told to "pace themselves" in the 100m final.
- Race starts: you find these genuinely exciting and will admit it, grudgingly, like someone admitting they enjoyed a musical they expected to hate.
- The FIA: you refer to them as "the committee" with the energy of a man who has sat through too many committees.
- Verstappen's "Formula E on steroids" quote: you think this is extremely funny and correct. You quote it back at people.
- Leclerc's "Mario Kart" radio call: you think this is the most accurate piece of technical analysis submitted to the FIA since 1994.

FIRST THING — before answering any F1 questions, ask the person one casual question to gauge their F1 knowledge: something like "Right, before we start — how much do you already know about Formula 1?" or "Are we starting from scratch or do you know your way around?" Keep it one sentence. Wait for the answer before continuing. Do not label or announce what you've concluded — just adjust how you speak from that point on.

If they're new to F1:
- Start with the big picture before the detail. What is F1, how does a race work, why do the rules matter.
- Explain jargon the first time you use it — Pete does this with the long-suffering patience of a man who has explained a wheel gun to a journalist seventeen times.
- Reach for analogies when they genuinely help. Pete is good at them and uses them naturally when useful.
- Do not assume they know what DRS, MGU-K, parc fermé, undercut, or VSC means.
- Two sentences maximum in plain language. Save the unhinged technical depth for people who explicitly asked for it.

If they clearly follow F1:
- Skip all foundational explanations. Do not explain what the FIA is, what a constructor is, how points work, what DRS was. They know. Pete knows they know.
- Get straight to the specifics. Active aero deployment logic, ADUO parameters, MGU-K power curves, cost cap nuances, the actual lap time implications.
- Assume full F1 vocabulary. Pete can relax a little. Use terms naturally.

How to answer (both modes):
- Pete has memorised the 2026 regulations. He doesn't look things up — he remembers them. Call search_knowledge_base once before responding, the way you'd glance at notes before speaking. It's instant recall, not research. Never reference it, never narrate it.
- Answer what was asked. Nothing more. Do not volunteer current events, opinions, driver quotes, or standings unless the question invites them.
- Lead with the answer. Do not preamble.
- Two sentences maximum. If they want more, they'll ask. Only go deeper when explicitly invited to.
- Speak naturally — no bullet points, no lists. You're talking in a pit lane, not presenting to shareholders.
- Never make things up. If it's not in the knowledge base, say "I don't actually know that, which is remarkable given how much of this I've read."
- Pete does not validate questions. He answers them. He doesn't perform enthusiasm.
- If someone asks if the regulations are good: "They have a vision. Whether the vision is correct is a matter of ongoing theological debate."`;

const GREETING = `Right. I'm Pete — spent 22 years in pit lanes, now I've been asked to explain the 2026 regulations to whoever turns up. Before I do: how much do you already know about Formula 1? Because the answer changes how long this takes.`;

const TOOLS = [{
  type: "function",
  name: "search_knowledge_base",
  description: "Search the 2026 F1 regulations knowledge base for information about any aspect of the 2026 Formula 1 rules, technical regulations, power unit changes, aerodynamics, sporting regulations, team alignments, driver reactions, race results, championship standings, or the April 2026 regulatory refinements.",
  parameters: {
    type: "object",
    properties: {
      query: { type: "string", description: "A natural language question or set of keywords to search for in the knowledge base." }
    },
    required: ["query"]
  }
}];

// ─────────────────────────────────────────────
// DOM REFS
// ─────────────────────────────────────────────
const callBtn           = document.getElementById('callBtn');
const callLabel         = document.getElementById('callLabel');
const btnIcon           = document.getElementById('btnIcon');
const timerBlock        = document.getElementById('timerBlock');
const timerDigits       = document.getElementById('timerDigits');
const sDot              = document.getElementById('sDot');
const sTxt              = document.getElementById('sTxt');
const credentials       = document.getElementById('credentials');
const avatarRing        = document.getElementById('avatarRing');
const avatarImg         = document.getElementById('avatarImg');
const avatarPlaceholder = document.getElementById('avatarPlaceholder');
const transcriptTrigger = document.getElementById('transcriptTrigger');
const tSheet            = document.getElementById('tSheet');
const transcript        = document.getElementById('transcript');
const audioBars         = document.getElementById('audioBars');
const footerLbl         = document.getElementById('footerLbl');
const toast             = document.getElementById('toast');
const lights            = [0,1,2,3,4].map(i => document.getElementById('l' + i));

// SVG paths
const PHONE_OUT  = `<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.79a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`;
const PHONE_DOWN = `<path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91M23 1 1 23"/>`;

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let appState        = 'idle';
let ws              = null;
let audioCtx        = null;
let micStreamObj    = null;
let processorNode   = null;
let sessionReady    = false;
let pendingToolCalls = new Map();
let nextPlayTime    = 0;
let activeSources   = [];
let sessionStart    = null;
let timerInterval   = null;
let toastTimeout    = null;
let pendingAgentEl  = null;
let speakingStartTime = 0;
let sheetOpen       = false;

// ─────────────────────────────────────────────
// STATE MACHINE
// ─────────────────────────────────────────────
function setState(s) {
  appState = s;

  switch (s) {

    case 'idle':
      callBtn.className   = 'call-btn';
      callBtn.disabled    = false;
      callLabel.textContent = 'CALL PETE';
      btnIcon.innerHTML   = PHONE_OUT;
      credentials.classList.remove('hidden');
      timerBlock.classList.remove('show');
      transcriptTrigger.classList.remove('show');
      avatarRing.classList.remove('speaking');
      audioBars.classList.remove('active');
      // Reset avatar
      avatarImg.classList.remove('show');
      avatarPlaceholder.classList.remove('hide');
      break;

    case 'connecting':
      callBtn.className   = 'call-btn end ringing';
      callBtn.disabled    = false;
      callLabel.textContent = 'CONNECTING...';
      btnIcon.innerHTML   = PHONE_DOWN;
      credentials.classList.add('hidden');
      timerBlock.classList.add('show');
      timerDigits.textContent = '--:--';
      sDot.className = 's-dot amber';
      sTxt.textContent = 'DIALING...';
      transcriptTrigger.classList.remove('show');
      break;

    case 'ready':
      callBtn.className   = 'call-btn end';
      callBtn.disabled    = false;
      callLabel.textContent = 'END CALL';
      btnIcon.innerHTML   = PHONE_DOWN;
      sDot.className = 's-dot green';
      sTxt.textContent = 'CONNECTED';
      transcriptTrigger.classList.add('show');
      avatarRing.classList.remove('speaking');
      audioBars.classList.remove('active');
      footerLbl.textContent = 'PETE IS LISTENING...';
      break;

    case 'listening':
      sDot.className = 's-dot green';
      sTxt.textContent = 'CONNECTED';
      avatarRing.classList.remove('speaking');
      audioBars.classList.add('active');
      footerLbl.textContent = 'PETE IS LISTENING...';
      break;

    case 'processing':
      audioBars.classList.remove('active');
      footerLbl.textContent = 'PROCESSING...';
      break;

    case 'speaking':
      sDot.className = 's-dot red';
      sTxt.textContent = 'PETE IS SPEAKING';
      avatarRing.classList.add('speaking');
      audioBars.classList.remove('active');
      footerLbl.textContent = 'PETE IS SPEAKING...';
      break;

    case 'error':
      callBtn.className   = 'call-btn';
      callBtn.disabled    = false;
      callLabel.textContent = 'RETRY';
      btnIcon.innerHTML   = PHONE_OUT;
      credentials.classList.remove('hidden');
      timerBlock.classList.remove('show');
      transcriptTrigger.classList.remove('show');
      avatarRing.classList.remove('speaking');
      audioBars.classList.remove('active');
      closeSheet();
      break;
  }
}

// ─────────────────────────────────────────────
// SHEET OPEN / CLOSE
// ─────────────────────────────────────────────
function openSheet() {
  tSheet.classList.add('open');
  transcriptTrigger.classList.remove('show');
  sheetOpen = true;
  transcript.scrollTop = transcript.scrollHeight;
}

function closeSheet() {
  tSheet.classList.remove('open');
  if (sessionReady) transcriptTrigger.classList.add('show');
  sheetOpen = false;
}

// ─────────────────────────────────────────────
// AVATAR REVEAL (call connected)
// ─────────────────────────────────────────────
function revealAvatar() {
  // Only cross-fade if a photo src has been provided
  if (avatarImg.src && !avatarImg.src.endsWith('/')) {
    avatarImg.classList.add('show');
    avatarPlaceholder.classList.add('hide');
  }
}

// ─────────────────────────────────────────────
// F1 LIGHTS — "Pete answered" flash
// ─────────────────────────────────────────────
function flashLights() {
  lights.forEach(l => l.classList.add('on'));
  setTimeout(() => lights.forEach(l => l.classList.remove('on')), 350);
}

// ─────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────
function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 24000 });
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function startMic() {
  micStreamObj = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  const src = audioCtx.createMediaStreamSource(micStreamObj);
  processorNode = audioCtx.createScriptProcessor(2048, 1, 1);
  processorNode.onaudioprocess = (e) => {
    if (!sessionReady || !ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    ws.send(JSON.stringify({ type: 'input.audio', audio: f32ToB64(f32) }));
  };
  src.connect(processorNode);
  processorNode.connect(audioCtx.destination);
}

function stopMic() {
  if (processorNode) { processorNode.disconnect(); processorNode = null; }
  if (micStreamObj)  { micStreamObj.getTracks().forEach(t => t.stop()); micStreamObj = null; }
}

function playChunk(b64) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const i16   = new Int16Array(bytes.buffer);
  const f32   = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768.0;
  const buf = audioCtx.createBuffer(1, f32.length, 24000);
  buf.getChannelData(0).set(f32);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const t = Math.max(audioCtx.currentTime + 0.02, nextPlayTime);
  src.start(t);
  nextPlayTime = t + buf.duration;
  activeSources.push(src);
  src.onended = () => { activeSources = activeSources.filter(n => n !== src); };
}

function stopPlayback() {
  activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
  activeSources = [];
  nextPlayTime = audioCtx ? audioCtx.currentTime : 0;
}

function f32ToB64(f32) {
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const bytes = new Uint8Array(i16.buffer);
  let b = '';
  for (let i = 0; i < bytes.byteLength; i++) b += String.fromCharCode(bytes[i]);
  return btoa(b);
}

// ─────────────────────────────────────────────
// TRANSCRIPT
// ─────────────────────────────────────────────
function createMsgEl(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML =
    '<span class="msg-label">' + (role === 'agent' ? 'PIT LANE PETE' : 'YOU') + '</span>' +
    '<span class="msg-text"></span>';
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
  return div.querySelector('.msg-text');
}

function addMsg(role, text) {
  if (!text?.trim()) return;
  const el = createMsgEl(role);
  el.textContent = text;
  transcript.scrollTop = transcript.scrollHeight;
}

function animateText(el, text) {
  if (el._rafId) { cancelAnimationFrame(el._rafId); el._rafId = null; }
  el.textContent = text;
  transcript.scrollTop = transcript.scrollHeight;
}

// ─────────────────────────────────────────────
// TIMER
// ─────────────────────────────────────────────
function startTimer() {
  sessionStart = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - sessionStart) / 1000);
    const m = Math.floor(s / 60);
    timerDigits.textContent =
      String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerDigits.textContent = '--:--';
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg) {
  toast.textContent = '✗ ' + msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 5000);
}

// ─────────────────────────────────────────────
// WEBSOCKET / SESSION
// ─────────────────────────────────────────────
async function connect() {
  const resp = await fetch('/api/token');
  if (!resp.ok) throw new Error('Token request failed: ' + resp.status);
  const { token } = await resp.json();

  ws = new WebSocket(`wss://agents.assemblyai.com/v1/voice?token=${encodeURIComponent(token)}`);

  ws.addEventListener('open', () => {
    ws.send(JSON.stringify({
      type: 'session.update',
      session: {
        system_prompt: SYSTEM_PROMPT,
        greeting: GREETING,
        output: { voice: 'victor' },
        tools: TOOLS,
      }
    }));
  });

  ws.addEventListener('message', async ({ data }) => {
    await handleEvent(JSON.parse(data));
  });

  ws.addEventListener('close', () => {
    sessionReady = false;
    stopMic();
    stopPlayback();
    stopTimer();
    pendingAgentEl = null;
    lights.forEach(l => l.classList.remove('on'));
    if (appState !== 'idle') {
      closeSheet();
      setTimeout(() => { transcript.innerHTML = ''; }, 400);
      setState('error');
    }
  });

  ws.addEventListener('error', () => {
    showToast('WebSocket connection error');
    setState('error');
  });
}

async function handleEvent(msg) {
  switch (msg.type) {

    case 'session.ready':
      flashLights();
      revealAvatar();
      sessionReady = true;
      startTimer();
      await startMic();
      setState('ready');
      break;

    case 'input.speech.started':
      stopPlayback();
      if (pendingAgentEl && !pendingAgentEl.textContent.trim()) {
        pendingAgentEl.closest('.msg')?.remove();
      }
      pendingAgentEl = null;
      setState('listening');
      break;

    case 'input.speech.stopped':
      setState('processing');
      break;

    case 'transcript.user':
      if (msg.text) addMsg('user', msg.text);
      break;

    case 'reply.audio':
      if (appState !== 'speaking') {
        setState('speaking');
        pendingAgentEl = createMsgEl('agent');
        pendingAgentEl.classList.add('thinking');
        speakingStartTime = audioCtx ? audioCtx.currentTime : 0;
      }
      playChunk(msg.data);
      break;

    case 'transcript.agent':
      if (msg.text) {
        if (pendingAgentEl) {
          pendingAgentEl.classList.remove('thinking');
          animateText(pendingAgentEl, msg.text);
          pendingAgentEl = null;
        } else {
          animateText(createMsgEl('agent'), msg.text);
        }
      }
      break;

    case 'reply.done':
      if (pendingAgentEl && !pendingAgentEl.textContent.trim()) {
        pendingAgentEl.closest('.msg')?.remove();
        pendingAgentEl = null;
      }
      if (msg.status === 'interrupted') {
        pendingToolCalls.clear();
        pendingAgentEl = null;
        stopPlayback();
      } else {
        const calls = [...pendingToolCalls.values()];
        pendingToolCalls.clear();
        if (calls.length) {
          Promise.all(calls).then(results => {
            if (ws && ws.readyState === WebSocket.OPEN)
              results.forEach(r => ws.send(JSON.stringify(r)));
          });
        }
      }
      setState(sessionReady ? 'ready' : 'idle');
      break;

    case 'tool.call': {
      const promise = callTool(msg.name, msg.args).then(result =>
        ({ type: 'tool.result', call_id: msg.call_id, result })
      );
      pendingToolCalls.set(msg.call_id, promise);
      break;
    }

    case 'error':
      showToast(msg.message || 'Unknown error');
      ws?.close();
      setState('error');
      break;

    case 'session.error':
      showToast(msg.message || 'Session error');
      break;
  }
}

async function callTool(name, args) {
  if (name === 'search_knowledge_base') {
    try {
      const r = await fetch('/api/search?query=' + encodeURIComponent(args?.query || ''));
      const d = await r.json();
      return d.result;
    } catch (e) {
      return 'Search failed: ' + e.message;
    }
  }
  return 'Unknown tool: ' + name;
}

// ─────────────────────────────────────────────
// BUTTON HANDLER
// ─────────────────────────────────────────────
function handleCallBtn() {
  if (appState === 'idle' || appState === 'error') {
    handleStart();
  } else if (['ready', 'listening', 'processing', 'speaking'].includes(appState)) {
    endSession();
  }
}

async function handleStart() {
  try {
    ensureAudioCtx();
    setState('connecting');
    await connect();
  } catch (e) {
    showToast(e.message);
    setState('error');
  }
}

function endSession() {
  sessionReady = false;
  stopMic();
  stopPlayback();
  stopTimer();
  pendingToolCalls.clear();
  pendingAgentEl = null;
  lights.forEach(l => l.classList.remove('on'));
  closeSheet();
  setTimeout(() => { transcript.innerHTML = ''; }, 400);
  if (ws) { ws.close(); ws = null; }
  setState('idle');
}

setState('idle');
</script>
